# A0 prototype CI (throwaway): build, tests and the generated-API check on Linux.
name: ci
on:
  push:
    branches: [prototype/a0]
  pull_request:
    branches: [prototype/a0]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }}
      - run: npm run check:generated
