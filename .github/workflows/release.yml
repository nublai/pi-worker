# Release on a v* tag (docs/plan/install.md section 1): build.sh for x64
# and arm64, then the four assets (each tarball and its .sha256) on that
# tag's GitHub release. Actions are pinned by full SHA. No dependency cache
# (a release never restores state another workflow wrote). The only
# credential is GITHUB_TOKEN, with contents: write in the publish job alone.
name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: build the ${{ matrix.arch }} tarball
        env:
          TMPDIR: ${{ runner.temp }}
          PIW_RELEASE_OUT: ${{ runner.temp }}/release
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: PIW_RELEASE_VERSION="${TAG#v}" harness/release/build.sh "$ARCH"
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: check the four assets against their .sha256
        working-directory: ${{ runner.temp }}/release
        run: |
          ls -l
          [ "$(ls -- *.tar.gz | wc -l)" = 2 ]
          [ "$(ls -- *.tar.gz.sha256 | wc -l)" = 2 ]
          for f in *.sha256; do sha256sum -c "$f"; done
      - name: attach them to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "pi-worker $TAG"
          --notes "pi-worker $TAG (docs/plan/install.md)"
          "$RUNNER_TEMP"/release/*
