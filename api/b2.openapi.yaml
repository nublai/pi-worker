  /b2/sessions/{session_id}/history:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: sessions.history
      summary: Read a session file's complete lines by byte range, with or without a worker
      description: |
        Shep's shape (a) of `history.page` (question S-1): pi's session-file lines from byte `offset`, complete
        lines only, ending on a line boundary, at most `max_bytes` unless one line alone is longer (then that one
        line, up to `Piw-History-Line-Max`). It reads any session of the catalog, so an archived session reads by
        `session_id` with no worker bound to it; scope is as for `sessions.get`.

        Headers: `Piw-File-Identity` is stable across appends and changes when the file is replaced;
        `Piw-Watermark` is the file's complete size (the byte after its last complete line), the value
        `history.appended` carries; `Piw-Next-Offset` is where the next read starts; `Piw-Tail-Sha256` is the
        SHA-256 of the last line read (with its line feed), to send back as `tail`; `Piw-Prefix-Sha256` is the
        SHA-256 of every byte before `Piw-Next-Offset`, to send back as `prefix`.

        Reset: send back `identity`, `tail` and `prefix` with the next `offset`. When the identity differs, the
        line ending at `offset` is not the one `tail` names, or the bytes before `offset` are not the ones
        `prefix` names (the file was replaced, shrank or was rewritten in place, including a rewrite followed by
        an append, or one made while the supervisor was down), the worker reads from byte 0 and sets
        `Piw-Reset: true`. The prefix is the check that survives a supervisor restart. Without `tail` or
        `prefix`, an offset past the watermark is `history_offset_past_watermark` and one not on a line start
        `history_offset_not_line_start`, both `400 no_effect`: a bad offset never reads as an empty page.
      tags: [readback]
      x-piw-mutation: false
      x-piw-body: none
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [jsonl]
            default: jsonl
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: max_bytes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 16777216
            default: 1048576
        - name: identity
          in: query
          schema:
            $ref: '#/components/schemas/FileIdentity'
        - name: tail
          in: query
          schema:
            $ref: '#/components/schemas/Sha256'
        - name: prefix
          in: query
          description: The `Piw-Prefix-Sha256` of the read that returned this `offset`.
          schema:
            $ref: '#/components/schemas/Sha256'
      responses:
        '200':
          description: Complete session-file lines.
          x-piw-response: ndjson
          x-piw-max-bytes: 67108864
          headers:
            Piw-Session-Id:
              required: true
              schema:
                $ref: '#/components/schemas/Id'
            Piw-File-Identity:
              required: true
              schema:
                $ref: '#/components/schemas/FileIdentity'
            Piw-Offset:
              required: true
              description: The byte the body starts at (0 after a reset).
              schema:
                type: integer
                minimum: 0
            Piw-Next-Offset:
              required: true
              schema:
                type: integer
                minimum: 0
            Piw-Watermark:
              required: true
              schema:
                type: integer
                minimum: 0
            Piw-Reset:
              required: true
              schema:
                type: boolean
            Piw-Tail-Sha256:
              description: Absent when nothing precedes `Piw-Next-Offset`.
              schema:
                $ref: '#/components/schemas/Sha256'
            Piw-Prefix-Sha256:
              required: true
              description: The SHA-256 of the bytes before `Piw-Next-Offset` (of no bytes when it is 0).
              schema:
                $ref: '#/components/schemas/Sha256'
            Piw-History-Line-Max:
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/x-ndjson:
              schema:
                type: string
                description: pi's session-file lines, unparsed; B2 does not own their schema.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
  /b2/models:
