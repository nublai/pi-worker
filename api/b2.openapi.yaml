  /b2/attachments/{attachment_id}:
    parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    put:
      operationId: attachments.stage
      summary: Stage one image for a later prompt (streamed binary upload)
      description: |
        The body is the image bytes, streamed; it never goes through the JSON path. The worker counts bytes as
        they arrive into a private staging file and refuses a body over `x-piw-max-bytes`
        (`hello.limits.attachment_max_bytes`) with `413`, removing the file. The command and the worker travel
        in headers; the session headers are recorded, and the prompt that uses the attachment checks its own
        binding. After the last byte the SHA-256 must equal `Piw-Content-Sha256` and the magic bytes must match
        the content type, else `400`, nothing staged. Then one journal record makes it `staged`.

        Idempotent by `attachment_id` plus SHA-256 (Shep's S-4): the same id with the same hash returns a receipt
        for the attachment already staged and stores nothing twice; the same id with another hash is refused
        `attachment_id_conflict`. A failure after the request bytes are written is `effect: unknown`: read
        `attachments.status` (or the receipt), never re-upload blindly. Allowed under a fence: staging writes no
        session; the prompt that uses the attachment is refused.
      tags: [input]
      x-piw-mutation: true
      x-piw-body: binary
      x-piw-max-bytes: 2097152
      parameters:
        - name: Piw-Command-Id
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: Piw-Worker-Id
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: Piw-Worker-Epoch
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: Piw-Session-Id
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: Piw-Binding-Revision
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
        - name: Piw-Content-Sha256
          in: header
          required: true
          description: Lower-case hex SHA-256 of the body.
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
      requestBody:
        required: true
        description: The image bytes.
        content:
          image/jpeg: {}
          image/png: {}
          image/webp: {}
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
    get:
      operationId: attachments.status
      summary: Read a staged attachment's state (after an upload whose reply was lost)
      description: |
        `receiving` while its upload is still streaming (memory), `staged` once its journal record is durable,
        `released` after `attachments.release` or after the prompt that used it was delivered. An unknown id is
        never proof that nothing was staged: `unknown_attachment_is_not_proof_of_no_effect`, `effect: unknown`.
      tags: [readback]
      x-piw-mutation: false
      x-piw-body: none
      responses:
        '200':
          description: The attachment.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
