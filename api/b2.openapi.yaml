                type: string
                minLength: 1
                maxLength: 128
        role:
          type: string
          minLength: 1
          maxLength: 128
        tools:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        denied_tools:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        resources:
          type: object
          additionalProperties: false
