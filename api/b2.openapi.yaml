        command_id:
          $ref: '#/components/schemas/Id'
        fence_generation:
          type: integer
          minimum: 1
        uncertain_command_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
    HistoryMarker:
      type: object
      additionalProperties: false
      required: [last_entry_id, lag, evidence]
      properties:
        last_entry_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        lag:
          type: boolean
        evidence:
          type: string
          const: pi_session_file
    GitPin:
      type: object
      additionalProperties: false
      description: >-
        Launch-time Git pointer bytes of a sandbox root. Relaunch and owner Git commands refuse when any value
        changed.
      required:
        - kind
        - dot_git
        - git_dir
        - common_dir
        - gitdir_file
        - commondir_file
        - head
        - config_sha256
        - alternates
      properties:
        kind:
          type: string
          enum: [linked, ordinary]
        dot_git:
          type: string
          maxLength: 4096
        git_dir:
          type: string
          maxLength: 4096
        common_dir:
          type: string
          maxLength: 4096
        gitdir_file:
          type: [string, 'null']
          maxLength: 4096
        commondir_file:
          type: [string, 'null']
          maxLength: 4096
        head:
          type: [string, 'null']
          maxLength: 4096
        config_sha256:
          type: string
          maxLength: 64
        alternates:
          type: [string, 'null']
          maxLength: 65536
    QueuedInput:
      type: object
      additionalProperties: false
      required: [command_id, kind, state]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum: [follow_up, child]
        state:
          type: string
          enum: [queued, paused, dropped, recovered, dispatched]
    Resolution:
      type: object
      additionalProperties: false
      required: [command_id, disposition, fence_generation]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        disposition:
          type: string
          enum: [keep, abandon, observed]
        fence_generation:
          type: integer
          minimum: 0
    WorkerFailure:
      type: object
      additionalProperties: false
      description: Why a launch ended the row in status failed. The launch receipt keeps its own effect label.
      required: [command_id, reason]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    Worker:
      type: object
      additionalProperties: false
      required:
        - worker_id
        - worker_epoch
        - supervisor_epoch
        - session_id
        - session_identity_evidence
        - binding_revision
        - leaf_id
        - cwd
        - status
        - foreground
        - execution
        - fence
        - history
        - cleanup
        - pending_interactions
      properties:
        worker_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        supervisor_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        session_identity_evidence:
          type: string
          enum: [pi_sdk_session_id, pi_session_file]
        binding_revision:
          type: integer
          minimum: 0
        leaf_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        cwd:
          $ref: '#/components/schemas/AbsolutePath'
        status:
          type: string
          enum: [starting, ready, stopped, cleanup_pending, failed]
        foreground:
          type: string
          enum: [idle, running, unknown]
        execution:
          anyOf:
            - $ref: '#/components/schemas/Execution'
            - type: 'null'
        fence:
          anyOf:
            - $ref: '#/components/schemas/Fence'
            - type: 'null'
        history:
          $ref: '#/components/schemas/HistoryMarker'
        cleanup:
          type: string
          minLength: 1
          maxLength: 64
        failure:
          $ref: '#/components/schemas/WorkerFailure'
        pending_interactions:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/Interaction'
              - $ref: '#/components/schemas/InteractionSummary'
            x-go-type: json.RawMessage
        queued:
          type: array
          items:
            $ref: '#/components/schemas/QueuedInput'
        fence_generation:
          type: integer
          minimum: 0
        resolutions:
          type: array
          items:
            $ref: '#/components/schemas/Resolution'
        git_pin:
          anyOf:
            - $ref: '#/components/schemas/GitPin'
            - type: 'null'
        parent:
          $ref: '#/components/schemas/Parent'
        launch_spec:
          $ref: '#/components/schemas/LaunchSpec'
        grant_source_id:
          $ref: '#/components/schemas/Id'
        child_reports:
          type: array
          items:
            $ref: '#/components/schemas/ChildClaim'
        parent_worker_id:
          $ref: '#/components/schemas/Id'
        parent_launch_command_id:
          $ref: '#/components/schemas/Id'
        host:
          $ref: '#/components/schemas/Host'
        resources:
          type: object
          additionalProperties: true
    Receipt:
      type: object
      additionalProperties: false
      required: [command_id, operation, request_hash, state, stage, effect, evidence, created_at]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        operation:
          type: string
          enum:
            - workers.create
            - sessions.prompt
            - workers.stop
            - workers.relaunch
            - sessions.resolve_unknown
            - sessions.rebind
            - sessions.new
            - sessions.follow_up
            - sessions.steer
            - children.launch
            - children.report
            - executions.cancel
            - executions.interrupt
            - interactions.answer_if_current
            - interactions.release
            - attachments.stage
        request_hash:
          type: string
          minLength: 1
          maxLength: 128
        state:
          type: string
          enum:
            - intent
            - intent_recovered
            - accepted
            - delivered
            - rejected
            - outcome_unknown
            - queued
            - queue_ready
            - intent_ready
        stage:
          type: string
          enum:
            - reserved
            - recovery_pending
            - dispatch_recorded
            - forwarded
            - termination_observed
            - refused
            - unknown
            - resolved
            - requested
            - answer_accepted
            - resolver_consumed
            - tool_released
        effect:
          type: string
          enum: [no_effect, unknown, observed]
        evidence:
          type: string
          const: supervisor_journal_fsynced
        created_at:
          type: string
          minLength: 1
          maxLength: 64
          description: RFC 3339 timestamp.
        worker_id:
          $ref: '#/components/schemas/Id'
        execution_id:
          $ref: '#/components/schemas/Id'
        admission:
          type: string
          enum: [accepted, rejected, queued]
        disposition:
          type: string
          minLength: 1
          maxLength: 64
        history_lag:
          type: boolean
        uncertain_command_id:
          $ref: '#/components/schemas/Id'
        error:
          type: string
          minLength: 1
          maxLength: 256
        result:
          type: object
          additionalProperties: true
        answer_stage:
          type: integer
          minimum: 1
          maximum: 4
    StopResult:
      type: object
      additionalProperties: true
      properties:
        termination:
          type: string
          enum: [observed_stopped, superseded_generation_stopped, superseded_generation_unknown, unknown]
          description: |
            observed_stopped: normal stop, generation confirmed gone. superseded_generation_stopped: old generation
            gone but a new relaunch was already running. superseded_generation_unknown: old generation cleanup
            outcome unknown, new generation running. unknown: cleanup outcome unknown, generation status not checked.
        stopped_worker_epoch:
          $ref: '#/components/schemas/Id'
        current_worker_epoch:
          $ref: '#/components/schemas/Id'
        profile:
          type: string
          enum: [cgroup_v2]
    StopReceipt:
      allOf:
        - $ref: '#/components/schemas/Receipt'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/StopResult'
    HistoryCursor:
      type: object
      additionalProperties: false
      required: [watermark, after]
      properties:
        watermark:
          type: string
          minLength: 1
          maxLength: 256
        after:
          type: [string, 'null']
          minLength: 1
          maxLength: 256
    HistoryPage:
      type: object
      additionalProperties: false
      required: [entries, watermark, next, leafId, truncated, evidence]
      properties:
        entries:
          type: array
          items:
            type: object
            additionalProperties: true
        watermark:
          type: [string, 'null']
          minLength: 1
          maxLength: 256
        next:
          anyOf:
            - $ref: '#/components/schemas/HistoryCursor'
            - type: 'null'
        leafId:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        truncated:
          type: boolean
        evidence:
          type: string
          const: pi_session_file
    HistoryItem:
      type: object
      additionalProperties: false
      required: [entry, bytes, evidence]
      properties:
        entry:
          type: object
          additionalProperties: true
        bytes:
          type: integer
          minimum: 0
          description: The size of the entry's raw line in the session file.
        evidence:
          type: string
          const: pi_session_file
    FileRead:
      type: object
      additionalProperties: false
      required: [path, roots]
      properties:
        path:
          $ref: '#/components/schemas/AbsolutePath'
        roots:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/AbsolutePath'
    FileContent:
      type: object
      additionalProperties: false
      required: [path, content, bytes, evidence]
      properties:
        path:
          $ref: '#/components/schemas/AbsolutePath'
        content:
          type: string
        bytes:
          type: integer
          minimum: 0
        evidence:
          type: string
          const: pinned_file_read
    Cursor:
      type: object
      additionalProperties: false
      description: >-
        Transport cursor. `transport_epoch` changes on every supervisor start and is independent of a worker's
        binding epoch.
      required: [transport_epoch, seq]
      properties:
        transport_epoch:
          $ref: '#/components/schemas/Id'
        seq:
          type: integer
          minimum: 0
    Producer:
      type: string
      enum: [pi, supervisor]
    EventEvidence:
      type: string
      enum: [observed_memory, supervisor_journal_fsynced]
    EventFrame:
      description: One SSE frame. `type` selects the member.
      oneOf:
        - $ref: '#/components/schemas/SnapshotEvent'
        - $ref: '#/components/schemas/OverflowEvent'
        - $ref: '#/components/schemas/WorkerUpdatedEvent'
        - $ref: '#/components/schemas/SessionReboundEvent'
        - $ref: '#/components/schemas/ExecutionSettledEvent'
        - $ref: '#/components/schemas/FenceResolvedEvent'
        - $ref: '#/components/schemas/InteractionsChangedEvent'
        - $ref: '#/components/schemas/ChildReportedEvent'
    SnapshotEvent:
      type: object
      additionalProperties: false
      description: Sent first on every attach, at a synchronous barrier. `workers` is authoritative. No event replay.
      x-piw-event:
        type: snapshot
        producer: supervisor
        durability: transport
        visibility: subscriber
      required: [type, workers, cursor, resync_reason]
      properties:
        type:
          type: string
          const: snapshot
        workers:
          type: array
          items:
            $ref: '#/components/schemas/Worker'
        cursor:
          $ref: '#/components/schemas/Cursor'
        resync_reason:
          type: string
          enum: [fresh, current, gap, epoch, ahead, evicted, overflow]
    OverflowEvent:
      type: object
      additionalProperties: false
      description: The subscriber queue overflowed; the stream closes after this frame and the caller resyncs.
      x-piw-event:
        type: overflow
        producer: supervisor
        durability: transport
        visibility: subscriber
      required: [type, cursor, event_id, producer, execution_id, evidence, data]
      properties:
        type:
          type: string
          const: overflow
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: 'null'
        evidence:
          type: string
          const: observed_memory
        data:
          type: object
          additionalProperties: false
          required: [resync_required, reason]
          properties:
            resync_required:
              type: boolean
              const: true
            reason:
              type: string
              minLength: 1
              maxLength: 64
    WorkerUpdatedEvent:
      type: object
      additionalProperties: false
      description: The full worker row after a change.
      x-piw-event:
        type: worker.updated
        producer: supervisor
        durability: labelled
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: worker.updated
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          $ref: '#/components/schemas/EventEvidence'
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [worker]
          properties:
            worker:
              $ref: '#/components/schemas/Worker'
    SessionReboundEvent:
      type: object
      additionalProperties: false
      description: The binding moved; mutations naming the old revision are refused.
      x-piw-event:
        type: session.rebound
        producer: supervisor
        durability: journal
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: session.rebound
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: supervisor_journal_fsynced
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [session_id, binding_revision, action]
          properties:
            session_id:
              type: [string, 'null']
              minLength: 1
              maxLength: 128
            binding_revision:
              type: integer
              minimum: 1
            action:
              type: string
              enum: [new, fork, resume, navigate, native]
              description: >-
                The move. `native` when pi moved on its own and the worker
                cannot tell which move it was.
            source:
              type: string
              enum: [native]
            old:
              type: object
              additionalProperties: true
    ExecutionSettledEvent:
      type: object
      additionalProperties: false
      description: pi reported agent_settled for the execution.
      x-piw-event:
        type: execution.settled
        producer: supervisor
        durability: memory
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: execution.settled
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          $ref: '#/components/schemas/Id'
        evidence:
          type: string
          const: observed_memory
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [disposition]
          properties:
            disposition:
              type: string
              minLength: 1
              maxLength: 64
    FenceResolvedEvent:
      type: object
      additionalProperties: false
      description: A fence was lifted. Resolving never claims an external effect was undone.
      x-piw-event:
        type: fence.resolved
        producer: supervisor
        durability: journal
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: fence.resolved
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: supervisor_journal_fsynced
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [command_id, disposition, fence_generation, external_effects_undone, fence]
          properties:
            command_id:
              $ref: '#/components/schemas/Id'
            disposition:
              type: string
              enum: [keep, abandon, observed]
            fence_generation:
              type: integer
              minimum: 0
            external_effects_undone:
              type: boolean
              const: false
            fence:
              anyOf:
                - $ref: '#/components/schemas/Fence'
                - type: 'null'
    ChildReportedEvent:
      type: object
      additionalProperties: false
      description: >-
        A child's report reached its durable receipt. A report is a claim, never
        proof; a `help` report never discharges the parent's launch fence.
      x-piw-event:
        type: child.reported
        producer: supervisor
        durability: journal
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: child.reported
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: supervisor_journal_fsynced
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [report_command_id, task_id, parent_worker_id, claim_not_verified]
          properties:
            report_command_id:
              $ref: '#/components/schemas/Id'
            task_id:
              $ref: '#/components/schemas/Id'
            parent_worker_id:
              type: [string, 'null']
              minLength: 1
              maxLength: 128
            kind:
              type: string
              enum: [result, help]
            claim_not_verified:
              type: boolean
              const: true
    InteractionsChangedEvent:
      type: object
      additionalProperties: false
      description: The live interaction cards of a worker.
      x-piw-event:
        type: interactions.changed
        producer: supervisor
        durability: memory
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: interactions.changed
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: observed_memory
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [interactions]
          properties:
            interactions:
              $ref: '#/components/schemas/Interactions'
