openapi: 3.1.0
info:
  title: pi-worker B2
  version: 0.1.0
  summary: Caller-to-worker API (B2) of nubl's pi-worker supervisor.
  description: |
    HTTP/1.1 over a private Unix socket (`$XDG_RUNTIME_DIR/pi-worker/b2.sock`, 0700 directory, 0600 socket).
    There is no TCP listener. This document is the single source for the server's request and response
    validators, the TypeScript types and the Go models (`npm run generate`).

    Seeded from A0 (`prototype/a0` at `ee66117`, `openapi.json`). The method catalog is draft until P6
    (contract revision 8, sections 4 onward); the behavioural invariants (sections 0, 0.1, 0.2) are frozen.

    Extensions:
    - `x-piw-mutation` (every operation): `true` when the operation changes state. A mutation's body
      requires `command_id`, a UUIDv7 (RFC 9562) the caller mints
      when it creates the command; a client never retries it; a
      failure after the request bytes are written is
      `effect: unknown`. A command id the worker may have admitted
      never runs again: past its retained receipt and expired id it
      is refused `command_id_beyond_retention`, `effect: no_effect`
      (see `receipt_expired_ids_max`).
    - `x-piw-status: unsupported`: the server routes and validates the operation and answers `501` with
      `effect: no_effect`.
    - `x-piw-event` (every event schema): the event manifest (type, producer, durability, visibility).
    - `x-piw-body` (every operation): the request body mode. `json`: `application/json` only, at most
      `x-piw-json-max-bytes` (below) unless the operation declares a smaller `x-piw-max-bytes`, validated
      against its schema. `binary`: the declared media types only, streamed with a byte counter and refused
      at `x-piw-max-bytes`, which a binary operation must declare. `none`: no body. The router enforces the
      mode before any handler: a wrong content type is `415`, a body over the limit `413`, a body on a `none`
      operation `400`, all `effect: no_effect`.
    - `x-piw-response` (every success response): `json`, `sse`, `ndjson` or `binary`. An `sse` response
      declares `x-piw-max-frame-bytes`, the most bytes one record may carry. An `ndjson` or `binary` response
      declares `x-piw-max-bytes` (the most body bytes) and its `headers`; the router validates the headers
      against their schemas, the content type against the declared media types and the length against the
      cap before anything is written, and an `ndjson` body must be complete lines, each one JSON value.

    - `x-piw-grant-profiles` (in `info`): named method lists a grant can be registered with. `bridge` is
      exactly the methods of Shep's worker driver (`docs/plan/b2-for-shep.md` section 2.1); `npm run api:lint`
      fails if the two differ, and the Go fake's closure test needs a route and a wire fixture for each.

    Named limit (invariant 8): private sockets and bearer grants do not isolate hostile code running as the
    same OS user.
  license:
    name: MIT
    identifier: MIT
  x-piw-json-max-bytes: 262144
  x-piw-grant-profiles:
    bridge:
      - hello
      - workers.list
      - workers.get
      - sessions.list
      - sessions.get
      - models.list
      - commands.list
      - events.subscribe
      - history.page
      - items.read
      - sessions.history
      - blobs.read
      - interactions.list
      - interactions.status
      - receipts.get
      - attachments.status
      - files.read
      - workers.create
      - sessions.prompt
      - session.configure
      - sessions.new
      - sessions.rebind
      - sessions.compact
      - resources.reload
      - commands.invoke
      - interactions.answer_if_current
      - executions.interrupt
      - workers.stop
      - workers.relaunch
      - sessions.resolve_unknown
      - attachments.stage
      - attachments.release
servers:
  - url: http://pi-worker
    description: HTTP over the worker's private Unix socket. The host name is not resolved.
security:
  - bearerGrant: []
tags:
  - name: handshake
    description: Protocol negotiation and named limits.
  - name: inventory
    description: Read-only worker rows.
  - name: lifecycle
    description: Create, stop and relaunch workers.
  - name: input
    description: Prompt and follow-up input.
  - name: recovery
    description: Bindings, fences and unknown outcomes.
  - name: interruption
    description: Cancel and interrupt executions.
  - name: interactions
    description: Live questions and approvals.
  - name: readback
    description: Events, history, receipts and files.
  - name: children
    description: Child launch and child reports.
  - name: features
    description: Models, commands and session settings (contract 8.1).
paths:
  /b2/hello:
    get:
      operationId: hello
      summary: Negotiate the protocol and read the named limits
      tags: [handshake]
      x-piw-mutation: false
      x-piw-body: none
      responses:
        '200':
          description: Supervisor identity, protocol and limits.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hello'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
  /b2/workers:
    get:
      operationId: workers.list
      summary: List the workers this grant may see
      tags: [inventory]
      x-piw-mutation: false
      x-piw-body: none
      responses:
        '200':
          description: Worker rows.
          x-piw-response: json
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: workers.create
      summary: Create a worker (launch pi), optionally with its first prompt
      description: |
        With `first_prompt`, one command and one receipt start a chat: once the
        worker is ready the supervisor admits the prompt as the worker's first
        execution, under the create's own `command_id`. The receipt names the
        worker, and either the execution (`admission: accepted`, `execution_id`,
        `disposition`) or the prompt's typed refusal (`admission: rejected`,
        `error`) with the worker created and idle. See `FirstPrompt`. A grant
        sends a first prompt only if it may also call `sessions.prompt`
        (`grant_method_denied` otherwise), here and in `children.launch`.
      tags: [lifecycle]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    get:
      operationId: workers.get
      summary: Read one worker row
      tags: [inventory]
      x-piw-mutation: false
      x-piw-body: none
      responses:
        '200':
          description: The worker row.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/configure:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: session.configure
      summary: Change the bound session's model, thinking level or name
      description: |
        A session write (contract 8.1): it names the binding it saw, is refused under a fence and while an
        execution runs, and after its dispatch record a lost reply is `outcome_unknown` and fences the session.
        At least one of `model`, `thinking` and `name`.
      tags: [features]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configure'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
  /b2/workers/{worker_id}/compact:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.compact
      summary: Compact the bound session (pi's /compact)
      description: |
        pi summarizes the session with its model and appends a compaction entry; live dialogs are cancelled at
        their exact resolvers first. The binding does not move (same session file, same tree).
        A session write: it names the binding it saw and is refused `no_effect` under a fence, during a binding
        move and while an execution runs (`worker_busy`). Its dispatch record precedes the write to pi; after it,
        only pi's explicit refusal before any change is `no_effect`, and a lost reply is `outcome_unknown` and
        fences the session.
      tags: [features]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Compact'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
  /b2/workers/{worker_id}/reload:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: resources.reload
      summary: Reload extensions, skills, prompts and context files (pi's /reload)
      description: |
        The receipt reports the loader errors after the reload; the worker row's `resources` follow. Live dialogs
        are cancelled at their exact resolvers first.
        A session write: it names the binding it saw and is refused `no_effect` under a fence, during a binding
        move and while an execution runs (`worker_busy`). Its dispatch record precedes the write to pi; after it,
        only pi's explicit refusal before any change is `no_effect`, and a lost reply is `outcome_unknown` and
        fences the session.
      tags: [features]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Binding'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
  /b2/workers/{worker_id}/commands/invoke:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: commands.invoke
      summary: Run an extension command (a slash command an extension registered)
      description: |
        Only an extension command `commands.list` names with `invocation: commands.invoke`. A built-in that has
        its own method (`/new`, `/model`, `/compact`, …) is refused `use_method` with the method in `detail`; any
        other built-in, prompt template or skill is refused `unsupported_command`; an unknown name
        `unknown_command`. All before any record.
        A session write: it names the binding it saw and is refused `no_effect` under a fence, during a binding
        move and while an execution runs (`worker_busy`). Its dispatch record precedes the write to pi; after it,
        only pi's explicit refusal before any change is `no_effect`, and a lost reply is `outcome_unknown` and
        fences the session.
      tags: [features]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invoke'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
  /b2/workers/{worker_id}/prompt:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.prompt
      summary: Send a prompt to the bound session
      tags: [input]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prompt'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/follow_up:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.follow_up
      summary: Queue a follow-up against a named execution
      tags: [input]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowUp'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/steer:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.steer
      summary: Steer the named running execution (delivered after its current turn)
      tags: [input]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Steer'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
  /b2/workers/{worker_id}/rebind:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.rebind
      summary: Move the binding (new, fork, resume, navigate)
      tags: [recovery]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rebind'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/new:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.new
      summary: Bind a new session (pi's /new); the binding revision moves and the old binding is refused
      tags: [recovery]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Binding'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
  /b2/workers/{worker_id}/resolve_unknown:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.resolve_unknown
      summary: Lift a fence with one disposition (keep, abandon, observed)
      tags: [recovery]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resolve'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/stop:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: workers.stop
      summary: Stop the worker's pi; keeps the session and environment
      tags: [lifecycle]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Binding'
      responses:
        '200':
          description: Stop receipt with the observed termination.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/relaunch:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: workers.relaunch
      summary: Relaunch pi on the same session after confirmed cleanup
      description: |
        Starts a fresh pi process for a stopped or failed worker, in a new
        cleanup domain at a new `worker_epoch`, and reopens the worker's
        session file without prompting. The binding names the worker's last
        generation. Refused `no_effect`, before anything is recorded or
        started: `stale_binding`; `cleanup_pending_or_cleanup_unproven` unless
        the previous epoch's domain was observed removed and that is recorded
        (`cleanup: cgroup_empty_removed`), so a live or pending worker is
        refused too; `session_fenced`, naming the uncertain command, until
        `sessions.resolve_unknown`; `session_already_bound` or
        `exclusive_environment_already_bound`, naming the holder, while another
        worker holds the session or the cwd; `relaunch_session_unavailable`
        without a bound session or its file; `child_relaunch_unsupported` for
        a child worker. The receipt names the new binding. A launch that fails
        after the dispatch record is `outcome_unknown` with the new domain
        cleaned; it does not fence the session, and a later relaunch may retry.
        Every earlier binding is stale afterwards, except the exact retry of a
        `sessions.prompt` intent that a restart recovered and the owner kept
        before this relaunch: it dispatches once on the first epoch a relaunch
        brought up, until the binding moves or another relaunch runs.
      tags: [lifecycle]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Binding'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: executions.cancel
      summary: Cancel the current execution; allowed while fenced
      tags: [interruption]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Control'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/interrupt:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: executions.interrupt
      summary: Escape equivalent; allowed while fenced
      tags: [interruption]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Control'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/children:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: children.launch
      summary: Launch a child worker under the current execution
      tags: [children]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildLaunch'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/report:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: children.report
      summary: A child's claim to its parent (a claim, not proof)
      tags: [children]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
