            not with `if_busy: steer`. The receipt's `result.accepted_images` is the number of images pi put in the
            message. A delivered prompt releases them.
          items:
            type: object
            additionalProperties: false
            required: [attachment_id]
            properties:
              attachment_id:
                $ref: '#/components/schemas/Id'
    FollowUp:
