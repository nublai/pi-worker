        A `tool_approval` card's approval: exactly what the worker's SDK
        child binds the tool gate to (sdk-child `Approval` plus its
        `gate_token`). The gate's release (`gate_check`) must repeat every
        field but `gate_token` unchanged and before `expiry`. The supervisor
        admits a card only with this whole object; any other field is
        dropped, and a card without a valid binding is never shown (its
        native dialog is cancelled, so the gate denies the tool).
      properties:
        digest:
          type: string
          minLength: 1
          maxLength: 4096
          description: The extension's digest of the exact tool input.
        policy_revision:
          type: string
          minLength: 1
          maxLength: 4096
        expiry:
          type: integer
          minimum: 0
          description: >-
            Milliseconds since the Unix epoch; the gate denies at or after it.
        operation:
          type: string
          minLength: 1
          maxLength: 4096
        resource:
          type: string
          minLength: 1
          maxLength: 4096
        environment:
          type: string
          minLength: 1
          maxLength: 4096
        offered_scope:
          type: string
          minLength: 1
          maxLength: 4096
        gate_token:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            The child's id for this gate (a UUID); its terminal notification
            names it.
    Interactions:
      type: array
      items:
        $ref: '#/components/schemas/Interaction'
    InteractionSummary:
      type: object
      additionalProperties: false
      required: [native_id, kind]
      description: A pending native interaction not yet admitted as a typed interaction.
      properties:
        native_id:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          minLength: 1
          maxLength: 64
    Execution:
      type: object
      additionalProperties: false
      required: [execution_id, command_id, state]
      properties:
        execution_id:
          $ref: '#/components/schemas/Id'
        command_id:
          $ref: '#/components/schemas/Id'
        state:
          type: string
          enum: [admitted, started, settled, outcome_unknown]
        disposition:
          type: string
          minLength: 1
          maxLength: 64
    Fence:
      type: object
      additionalProperties: false
      required: [command_id, fence_generation, fenced_at]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        fence_generation:
          type: integer
          minimum: 1
        fenced_at:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            RFC 3339 time the worker latched this fence in its journal: the
            fence record's own timestamp, on the clock of receipt `created_at`.
            Set once; a later uncertainty or a partial resolution never changes
            it, and a restart keeps it.
        uncertain_command_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
    HistoryMarker:
      type: object
      additionalProperties: false
      required: [last_entry_id, lag, evidence]
      properties:
        last_entry_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        lag:
          type: boolean
        evidence:
          type: string
          const: pi_session_file
    GitPin:
      type: object
      additionalProperties: false
      description: >-
        Launch-time Git pointer bytes of a sandbox root. Relaunch and owner Git commands refuse when any value
        changed.
      required:
        - kind
        - dot_git
        - git_dir
        - common_dir
        - gitdir_file
        - commondir_file
        - head
        - config_sha256
        - alternates
      properties:
        kind:
          type: string
          enum: [linked, ordinary]
        dot_git:
          type: string
          maxLength: 4096
        git_dir:
          type: string
          maxLength: 4096
        common_dir:
          type: string
          maxLength: 4096
        gitdir_file:
          type: [string, 'null']
          maxLength: 4096
        commondir_file:
          type: [string, 'null']
          maxLength: 4096
        head:
          type: [string, 'null']
          maxLength: 4096
        config_sha256:
          type: string
          maxLength: 64
        alternates:
          type: [string, 'null']
          maxLength: 65536
    QueuedInput:
      type: object
      additionalProperties: false
      required: [command_id, kind, state]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum: [follow_up, child]
        state:
          type: string
          enum: [queued, paused, dropped, recovered, dispatched]
    Resolution:
      type: object
      additionalProperties: false
      required: [command_id, disposition, fence_generation]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        disposition:
          type: string
          enum: [keep, abandon, observed]
        fence_generation:
          type: integer
          minimum: 0
    WorkerFailure:
      type: object
      additionalProperties: false
      description: Why a launch ended the row in status failed. The launch receipt keeps its own effect label.
      required: [command_id, reason]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        reason:
          type: string
          minLength: 1
          maxLength: 1024
    Worker:
      type: object
      additionalProperties: false
      required:
        - worker_id
        - worker_epoch
        - supervisor_epoch
        - session_id
        - session_identity_evidence
        - binding_revision
        - leaf_id
        - cwd
        - status
        - foreground
        - execution
        - fence
        - history
        - cleanup
        - pending_interactions
      properties:
        worker_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        supervisor_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        session_identity_evidence:
          type: string
          enum: [pi_sdk_session_id, pi_session_file]
        binding_revision:
          type: integer
          minimum: 0
        leaf_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        cwd:
          $ref: '#/components/schemas/AbsolutePath'
        status:
          type: string
          enum: [starting, ready, stopped, cleanup_pending, failed]
        foreground:
          type: string
          enum: [idle, running, unknown]
        execution:
          anyOf:
            - $ref: '#/components/schemas/Execution'
            - type: 'null'
        fence:
          anyOf:
            - $ref: '#/components/schemas/Fence'
            - type: 'null'
        history:
          $ref: '#/components/schemas/HistoryMarker'
        cleanup:
          type: string
          minLength: 1
          maxLength: 64
        failure:
          $ref: '#/components/schemas/WorkerFailure'
        pending_interactions:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/Interaction'
              - $ref: '#/components/schemas/InteractionSummary'
            x-go-type: json.RawMessage
        queued:
          type: array
          items:
            $ref: '#/components/schemas/QueuedInput'
        fence_generation:
          type: integer
          minimum: 0
        resolutions:
          type: array
          items:
            $ref: '#/components/schemas/Resolution'
        git_pin:
          anyOf:
            - $ref: '#/components/schemas/GitPin'
            - type: 'null'
        parent:
          $ref: '#/components/schemas/Parent'
        launch_spec:
          $ref: '#/components/schemas/LaunchSpec'
        grant_source_id:
          $ref: '#/components/schemas/Id'
        child_reports:
          type: array
          items:
            $ref: '#/components/schemas/ChildClaim'
        parent_worker_id:
          $ref: '#/components/schemas/Id'
        parent_launch_command_id:
          $ref: '#/components/schemas/Id'
        host:
          $ref: '#/components/schemas/Host'
        resources:
          type: object
          additionalProperties: true
        status_since:
          type: string
          minLength: 1
          maxLength: 64
          description: RFC 3339 time the status last changed.
        settle_count:
          type: integer
          minimum: 0
          description: Executions pi reported settled on this worker (finished-unseen on the phone).
        recent_settlements:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/RecentSettlement'
          description: >-
            The worker's last settled executions, newest first, at most
            8. Journaled with the row, so a subscriber that missed
            `execution.settled` (a disconnect, an overflow, a supervisor
            restart) recovers each settlement from the next snapshot. An
            execution appears once. The cap covers a reconnect gap of
            eight turns and keeps the row small in every snapshot,
            `worker.updated` and journal record; a `settle_count` gap
            larger than the list means some settlements are only in the
            session history.
        lineage:
          $ref: '#/components/schemas/Lineage'
        repo_label:
          type: [string, 'null']
          maxLength: 256
          description: The name of the Git work tree holding the cwd, else the cwd's base name.
        title:
          type: [string, 'null']
          maxLength: 512
          description: The session's display name (pi's session_info), set by `session.configure` or natively.
        preview:
          $ref: '#/components/schemas/Preview'
        first_user_line:
          type: [string, 'null']
          maxLength: 280
          description: >-
            The first line of the session's first user text, without the
            worker's interrupt marker and trimmed, read from the session file
            as `preview` is (a title fallback).
            Null before pi wrote a user message with text.
            The worker cuts it to at most 280 UTF-16 code units, never inside
            a character. The schema's `maxLength` counts characters (Unicode
            code points), so it checks only the looser bound of 280
            characters; a client must not rely on validation for the
            code-unit bound.
        last_activity_at:
          type: [string, 'null']
          maxLength: 64
          description: RFC 3339 time of the newest entry in the session file.
        model:
          anyOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
        thinking:
          anyOf:
            - $ref: '#/components/schemas/Thinking'
            - type: 'null'
    RecentSettlement:
      type: object
      additionalProperties: false
      required: [execution_id, command_id, disposition, settled_at]
      properties:
        execution_id:
          $ref: '#/components/schemas/Id'
        command_id:
          $ref: '#/components/schemas/Id'
        disposition:
          type: string
          minLength: 1
          maxLength: 64
          description: The disposition `execution.settled` carried.
        settled_at:
          type: string
          minLength: 1
          maxLength: 64
          description: RFC 3339 time the supervisor recorded the settlement.
    Lineage:
      type: string
      enum: [root, child, unknown]
      description: A child names its parent; old and natively launched sessions are unknown, never roots.
    Preview:
      type: [string, 'null']
      maxLength: 512
      description: >-
        The newest user or assistant text in the session file, without the worker's interrupt marker, at most 280
        characters.
    ModelRef:
      type: object
      additionalProperties: false
      required: [provider, id]
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 128
        id:
          type: string
          minLength: 1
          maxLength: 256
    Configure:
      type: object
      additionalProperties: false
      required: [command_id, worker_epoch, session_id, binding_revision]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        binding_revision:
          type: integer
          minimum: 1
        model:
          $ref: '#/components/schemas/ModelRef'
        thinking:
          $ref: '#/components/schemas/Thinking'
        name:
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
    Compact:
      type: object
      additionalProperties: false
      required: [command_id, worker_epoch, session_id, binding_revision]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        binding_revision:
          type: integer
          minimum: 1
        custom_instructions:
          type: string
          minLength: 1
          maxLength: 8192
    Invoke:
      type: object
      additionalProperties: false
      required: [command_id, worker_epoch, session_id, binding_revision, name]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        binding_revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\s/][^\s]*$
          description: The command's name without the leading slash.
        args:
          type: string
          maxLength: 65536
    Release:
      type: object
      additionalProperties: false
      required: [command_id]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
    AttachmentStatus:
      type: object
      additionalProperties: false
      required: [attachment_id, worker_id, state, content_type, bytes, sha256, command_id, staged_at, released_at, released_by, evidence]
      properties:
        attachment_id:
          $ref: '#/components/schemas/Id'
        worker_id:
          $ref: '#/components/schemas/Id'
        state:
          type: string
          enum: [receiving, staged, released]
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        bytes:
          type: integer
          minimum: 0
          description: For `receiving`, the bytes received so far.
        sha256:
          $ref: '#/components/schemas/Sha256'
        command_id:
          $ref: '#/components/schemas/Id'
          description: The `attachments.stage` command that staged it (or is staging it).
        staged_at:
          type: [string, 'null']
          maxLength: 64
        released_at:
          type: [string, 'null']
          maxLength: 64
        released_by:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: The command that released it (`attachments.release`, or the prompt that delivered it).
        evidence:
          type: string
          enum: [supervisor_journal_fsynced, observed_memory]
    FileIdentity:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: Stable across appends to one session file; changes when the file is replaced.
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    SessionTokens:
      type: object
      additionalProperties: false
      required: [input, output, cache_read, cache_write, total]
      properties:
        input:
          type: integer
          minimum: 0
        output:
          type: integer
          minimum: 0
        cache_read:
          type: integer
          minimum: 0
        cache_write:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    SessionStats:
      type: object
      additionalProperties: false
      required: [user_messages, assistant_messages, tool_calls, tokens, cost_total, models]
      properties:
        user_messages:
          type: integer
          minimum: 0
        assistant_messages:
          type: integer
          minimum: 0
        tool_calls:
          type: integer
          minimum: 0
        tokens:
          $ref: '#/components/schemas/SessionTokens'
        cost_total:
          type: number
          minimum: 0
        models:
          type: array
          maxItems: 64
          description: Per-model usage and cost, from the assistant messages' own usage records.
          items:
            type: object
            additionalProperties: false
            required: [provider, model, assistant_messages, tokens_total, cost_total]
            properties:
              provider:
                type: string
                maxLength: 128
              model:
                type: string
                maxLength: 256
              assistant_messages:
                type: integer
                minimum: 0
              tokens_total:
                type: integer
                minimum: 0
              cost_total:
                type: number
                minimum: 0
    SessionRow:
      type: object
      additionalProperties: false
      required:
        - session_id
        - cwd
        - title
        - preview
        - created_at
        - last_activity_at
        - message_count
        - holder_worker_id
        - last_worker_id
        - fenced
        - lineage
        - stats
        - evidence
      properties:
        session_id:
          $ref: '#/components/schemas/Id'
        cwd:
          $ref: '#/components/schemas/AbsolutePath'
        title:
          type: [string, 'null']
          maxLength: 512
        preview:
          $ref: '#/components/schemas/Preview'
        created_at:
          type: [string, 'null']
          maxLength: 64
        last_activity_at:
          type: [string, 'null']
          maxLength: 64
        message_count:
          type: integer
          minimum: 0
        holder_worker_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: The worker that holds the session now ("open in"); null when no worker holds it.
        last_worker_id:
          $ref: '#/components/schemas/Id'
        fenced:
          type: boolean
          description: The last owner's fence is unresolved; resume is refused `target_session_fenced`.
        lineage:
          $ref: '#/components/schemas/Lineage'
        stats:
          $ref: '#/components/schemas/SessionStats'
        evidence:
          type: string
          const: pi_session_file
    SessionList:
      type: object
      additionalProperties: false
      required: [sessions, truncated]
      properties:
        sessions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SessionRow'
        truncated:
          type: boolean
          description: More sessions matched than `limit`.
    Model:
      type: object
      additionalProperties: false
      required: [provider, id, name, reasoning, input, context_window, max_tokens]
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 128
        id:
          type: string
          minLength: 1
          maxLength: 256
        name:
          type: string
          maxLength: 256
        reasoning:
          type: boolean
        input:
          type: array
          maxItems: 8
          items:
            type: string
            enum: [text, image]
        context_window:
          type: integer
          minimum: 0
        max_tokens:
          type: integer
          minimum: 0
    ModelList:
      type: object
      additionalProperties: false
      required: [models, current, thinking, thinking_levels, evidence]
      properties:
        models:
          type: array
          maxItems: 2048
          items:
            $ref: '#/components/schemas/Model'
        current:
          anyOf:
            - $ref: '#/components/schemas/ModelRef'
            - type: 'null'
        thinking:
          anyOf:
            - $ref: '#/components/schemas/Thinking'
            - type: 'null'
        thinking_levels:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/Thinking'
        evidence:
          type: string
          enum: [pi_worker_process, pi_inventory_process]
    Command:
      type: object
      additionalProperties: false
      required: [name, description, source, argument_hint, invocation, method]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: [string, 'null']
          maxLength: 4096
        source:
          type: string
          enum: [builtin, extension, prompt, skill]
        argument_hint:
          type: [string, 'null']
          maxLength: 256
        invocation:
          type: string
          enum: [commands.invoke, method, unsupported]
          description: >-
            How the command runs through B2: `commands.invoke`; `method`, the typed method in `method` (a built-in
            with its own operation); or `unsupported`, refused explicitly.
        method:
          type: [string, 'null']
          maxLength: 128
    CommandList:
      type: object
      additionalProperties: false
      required: [commands, evidence]
      properties:
        commands:
          type: array
          maxItems: 4096
          items:
            $ref: '#/components/schemas/Command'
        evidence:
          type: string
          enum: [pi_worker_process, pi_inventory_process]
    Receipt:
      type: object
      additionalProperties: false
      required: [command_id, operation, request_hash, state, stage, effect, evidence, created_at]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        operation:
          type: string
          enum:
            - workers.create
            - sessions.prompt
            - workers.stop
            - workers.relaunch
            - sessions.resolve_unknown
            - sessions.rebind
            - sessions.new
            - sessions.follow_up
            - sessions.steer
            - children.launch
            - children.report
            - executions.cancel
            - executions.interrupt
            - interactions.answer_if_current
            - interactions.release
            - attachments.stage
            - session.configure
            - sessions.compact
            - resources.reload
            - commands.invoke
            - attachments.release
        request_hash:
          type: string
          minLength: 1
          maxLength: 128
        state:
          type: string
          enum:
            - intent
            - intent_recovered
            - accepted
            - delivered
            - rejected
            - outcome_unknown
            - queued
            - queue_ready
            - intent_ready
        stage:
          type: string
          enum:
            - reserved
            - recovery_pending
            - dispatch_recorded
            - forwarded
            - termination_observed
            - refused
            - unknown
            - resolved
            - requested
            - answer_accepted
            - resolver_consumed
            - tool_released
        effect:
          type: string
          enum: [no_effect, unknown, observed]
        evidence:
          type: string
          const: supervisor_journal_fsynced
        created_at:
          type: string
          minLength: 1
          maxLength: 64
          description: RFC 3339 timestamp.
        worker_id:
          $ref: '#/components/schemas/Id'
        execution_id:
          $ref: '#/components/schemas/Id'
        admission:
          type: string
          enum: [accepted, rejected, queued]
        disposition:
          type: string
          minLength: 1
          maxLength: 64
        history_lag:
          type: boolean
        uncertain_command_id:
          $ref: '#/components/schemas/Id'
        error:
          type: string
          minLength: 1
          maxLength: 256
        result:
          type: object
          additionalProperties: true
        answer_stage:
          type: integer
          minimum: 1
          maximum: 4
    StopResult:
      type: object
      additionalProperties: true
      properties:
        termination:
          type: string
          enum: [observed_stopped, superseded_generation_stopped, superseded_generation_unknown, unknown]
          description: |
            observed_stopped: normal stop, generation confirmed gone. superseded_generation_stopped: old generation
            gone but a new relaunch was already running. superseded_generation_unknown: old generation cleanup
            outcome unknown, new generation running. unknown: cleanup outcome unknown, generation status not checked.
        stopped_worker_epoch:
          $ref: '#/components/schemas/Id'
        current_worker_epoch:
          $ref: '#/components/schemas/Id'
        profile:
          type: string
          enum: [cgroup_v2]
    StopReceipt:
      allOf:
        - $ref: '#/components/schemas/Receipt'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/StopResult'
    HistoryCursor:
      type: object
      additionalProperties: false
      required: [watermark, after]
      properties:
        watermark:
          type: string
          minLength: 1
          maxLength: 256
        after:
          type: [string, 'null']
          minLength: 1
          maxLength: 256
    HistoryPage:
      type: object
      additionalProperties: false
      required: [entries, watermark, next, leafId, truncated, evidence]
      properties:
        entries:
          type: array
          items:
            type: object
            additionalProperties: true
        watermark:
          type: [string, 'null']
          minLength: 1
          maxLength: 256
        next:
          anyOf:
            - $ref: '#/components/schemas/HistoryCursor'
            - type: 'null'
        leafId:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        truncated:
          type: boolean
        evidence:
          type: string
          const: pi_session_file
    HistoryItem:
      type: object
      additionalProperties: false
      required: [entry, bytes, evidence]
      properties:
        entry:
          type: object
          additionalProperties: true
        bytes:
          type: integer
          minimum: 0
          description: The size of the entry's raw line in the session file.
        evidence:
          type: string
          const: pi_session_file
    FileRead:
      type: object
      additionalProperties: false
      required: [path, roots]
      properties:
        path:
          $ref: '#/components/schemas/AbsolutePath'
        roots:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/AbsolutePath'
    FileContent:
      type: object
      additionalProperties: false
      required: [path, content, bytes, evidence]
      properties:
        path:
          $ref: '#/components/schemas/AbsolutePath'
        content:
          type: string
        bytes:
          type: integer
          minimum: 0
        evidence:
          type: string
          const: pinned_file_read
    Cursor:
      type: object
      additionalProperties: false
      description: >-
        Transport cursor. `transport_epoch` changes on every supervisor start and is independent of a worker's
        binding epoch.
      required: [transport_epoch, seq]
      properties:
        transport_epoch:
          $ref: '#/components/schemas/Id'
        seq:
          type: integer
          minimum: 0
    Producer:
      type: string
      enum: [pi, supervisor]
    EventEvidence:
      type: string
      enum: [observed_memory, supervisor_journal_fsynced]
    EventFrame:
      description: One SSE frame. `type` selects the member.
      oneOf:
        - $ref: '#/components/schemas/SnapshotEvent'
        - $ref: '#/components/schemas/OverflowEvent'
        - $ref: '#/components/schemas/WorkerUpdatedEvent'
        - $ref: '#/components/schemas/SessionReboundEvent'
        - $ref: '#/components/schemas/ExecutionSettledEvent'
        - $ref: '#/components/schemas/FenceResolvedEvent'
        - $ref: '#/components/schemas/InteractionsChangedEvent'
        - $ref: '#/components/schemas/HistoryAppendedEvent'
        - $ref: '#/components/schemas/ChildReportedEvent'
        - $ref: '#/components/schemas/ExecutionAdmittedEvent'
        - $ref: '#/components/schemas/ExecutionStartedEvent'
        - $ref: '#/components/schemas/AssistantDeltaEvent'
        - $ref: '#/components/schemas/ToolStartedEvent'
        - $ref: '#/components/schemas/ToolFinishedEvent'
        - $ref: '#/components/schemas/ReceiptUpdatedEvent'
        - $ref: '#/components/schemas/FenceSetEvent'
        - $ref: '#/components/schemas/AttachmentUpdatedEvent'
    SnapshotEvent:
      type: object
      additionalProperties: false
      description: Sent first on every attach, at a synchronous barrier. `workers` is authoritative. No event replay.
      x-piw-event:
        type: snapshot
        producer: supervisor
        durability: transport
        visibility: subscriber
      required: [type, workers, cursor, resync_reason]
      properties:
        type:
          type: string
          const: snapshot
        workers:
          type: array
          items:
            $ref: '#/components/schemas/Worker'
        cursor:
          $ref: '#/components/schemas/Cursor'
        resync_reason:
          type: string
          enum: [fresh, current, gap, epoch, ahead, evicted, overflow]
    OverflowEvent:
      type: object
      additionalProperties: false
      description: The subscriber queue overflowed; the stream closes after this frame and the caller resyncs.
      x-piw-event:
        type: overflow
        producer: supervisor
        durability: transport
        visibility: subscriber
      required: [type, cursor, event_id, producer, execution_id, evidence, data]
      properties:
        type:
          type: string
          const: overflow
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: 'null'
        evidence:
          type: string
          const: observed_memory
        data:
          type: object
          additionalProperties: false
          required: [resync_required, reason]
          properties:
            resync_required:
              type: boolean
              const: true
            reason:
              type: string
              minLength: 1
              maxLength: 64
    WorkerUpdatedEvent:
      type: object
      additionalProperties: false
      description: The full worker row after a change.
      x-piw-event:
        type: worker.updated
        producer: supervisor
        durability: labelled
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: worker.updated
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          $ref: '#/components/schemas/EventEvidence'
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [worker]
          properties:
            worker:
              $ref: '#/components/schemas/Worker'
    SessionReboundEvent:
      type: object
      additionalProperties: false
      description: The binding moved; mutations naming the old revision are refused.
      x-piw-event:
        type: session.rebound
        producer: supervisor
        durability: journal
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: session.rebound
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: supervisor_journal_fsynced
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [session_id, binding_revision, action]
          properties:
            session_id:
              type: [string, 'null']
              minLength: 1
              maxLength: 128
            binding_revision:
              type: integer
              minimum: 1
            action:
              type: string
              enum: [new, fork, resume, navigate, native]
              description: >-
                The move. `native` when pi moved on its own and the worker
                cannot tell which move it was.
            source:
              type: string
              enum: [native]
            old:
              type: object
              additionalProperties: true
    ExecutionSettledEvent:
      type: object
      additionalProperties: false
      description: >-
        pi reported agent_settled for the execution (or pi handled the prompt
        without a turn). The frame is memory only; the settlement itself is
        journaled in the worker row's `recent_settlements`, which every
        snapshot carries.
      x-piw-event:
        type: execution.settled
        producer: supervisor
        durability: memory
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: execution.settled
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          $ref: '#/components/schemas/Id'
        evidence:
          type: string
          const: observed_memory
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [command_id, disposition]
          properties:
            command_id:
              $ref: '#/components/schemas/Id'
            disposition:
              type: string
              minLength: 1
              maxLength: 64
    FenceResolvedEvent:
      type: object
      additionalProperties: false
      description: A fence was lifted. Resolving never claims an external effect was undone.
      x-piw-event:
        type: fence.resolved
        producer: supervisor
        durability: journal
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: fence.resolved
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: supervisor_journal_fsynced
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [command_id, disposition, fence_generation, external_effects_undone, fence]
          properties:
            command_id:
              $ref: '#/components/schemas/Id'
            disposition:
              type: string
              enum: [keep, abandon, observed]
            fence_generation:
              type: integer
              minimum: 0
            external_effects_undone:
              type: boolean
              const: false
            fence:
              anyOf:
                - $ref: '#/components/schemas/Fence'
                - type: 'null'
    ChildReportedEvent:
      type: object
      additionalProperties: false
      description: >-
        A child's report reached its durable receipt. A report is a claim, never
        proof; a `help` report never discharges the parent's launch fence.
      x-piw-event:
        type: child.reported
        producer: supervisor
        durability: journal
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: child.reported
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: supervisor_journal_fsynced
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [report_command_id, task_id, parent_worker_id, claim_not_verified]
          properties:
            report_command_id:
              $ref: '#/components/schemas/Id'
            task_id:
              $ref: '#/components/schemas/Id'
            parent_worker_id:
              type: [string, 'null']
              minLength: 1
              maxLength: 128
            kind:
              type: string
              enum: [result, help]
            claim_not_verified:
              type: boolean
              const: true
    InteractionsChangedEvent:
      type: object
      additionalProperties: false
      description: The live interaction cards of a worker.
      x-piw-event:
        type: interactions.changed
        producer: supervisor
        durability: memory
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: interactions.changed
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: observed_memory
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [interactions]
          properties:
            interactions:
              $ref: '#/components/schemas/Interactions'
    HistoryAppendedEvent:
      type: object
      additionalProperties: false
      description: >-
        A worker's session file grew or was replaced. `watermark` is the file's complete size, the value
        `sessions.history` returns in `Piw-Watermark` for the same bytes.
      x-piw-event:
        type: history.appended
        producer: supervisor
        durability: memory
        visibility: worker
      required: [type, cursor, event_id, producer, execution_id, evidence, worker_id, data]
      properties:
        type:
          type: string
          const: history.appended
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: observed_memory
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [session_id, file_identity, watermark, last_entry_id]
          properties:
            session_id:
              $ref: '#/components/schemas/Id'
            file_identity:
              $ref: '#/components/schemas/FileIdentity'
            watermark:
              type: integer
              minimum: 0
            last_entry_id:
              type: [string, 'null']
              minLength: 1
              maxLength: 128
    ExecutionAdmittedEvent:
      type: object
      additionalProperties: false
      description: >-
        The supervisor admitted an execution and journaled it, before the
        prompt reaches pi.
      x-piw-event:
        type: execution.admitted
        producer: supervisor
        durability: journal
        visibility: worker
      required:
        - type
        - cursor
        - event_id
        - producer
        - execution_id
        - evidence
        - worker_id
        - data
      properties:
        type:
          type: string
          const: execution.admitted
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          $ref: '#/components/schemas/Id'
        evidence:
          type: string
