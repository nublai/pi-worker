    Parent:
      type: object
      additionalProperties: false
      required: [worker_id, worker_epoch, session_id, binding_revision, execution_id, task_id, generation_id]
      properties:
        worker_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        binding_revision:
          type: integer
          minimum: 1
        execution_id:
          $ref: '#/components/schemas/Id'
        task_id:
