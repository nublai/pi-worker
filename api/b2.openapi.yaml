openapi: 3.1.0
info:
  title: pi-worker B2
  version: 0.1.0
  summary: Caller-to-worker API (B2) of nubl's pi-worker supervisor.
  description: |
    HTTP/1.1 over a private Unix socket (`$XDG_RUNTIME_DIR/pi-worker/b2.sock`, 0700 directory, 0600 socket).
    There is no TCP listener. This document is the single source for the server's request and response
    validators, the TypeScript types and the Go models (`npm run generate`).

    Seeded from A0 (`prototype/a0` at `ee66117`, `openapi.json`). The method catalog is draft until P6
    (contract revision 8, sections 4 onward); the behavioural invariants (sections 0, 0.1, 0.2) are frozen.

    Extensions:
    - `x-piw-mutation` (every operation): `true` when the operation changes state. A mutation's body
      requires `command_id`, a UUIDv7 (RFC 9562) the caller mints
      when it creates the command; a client never retries it; a
      failure after the request bytes are written is
      `effect: unknown`. A command id the worker may have admitted
      never runs again: past its retained receipt and expired id it
      is refused `command_id_beyond_retention`, `effect: no_effect`
      (see `receipt_expired_ids_max`).
    - `x-piw-status: unsupported`: the server routes and validates the operation and answers `501` with
      `effect: no_effect`.
    - `x-piw-event` (every event schema): the event manifest (type, producer, durability, visibility).
    - `x-piw-body` (every operation): the request body mode. `json`: `application/json` only, at most
      `x-piw-json-max-bytes` (below) unless the operation declares a smaller `x-piw-max-bytes`, validated
      against its schema. `binary`: the declared media types only, streamed with a byte counter and refused
      at `x-piw-max-bytes`, which a binary operation must declare. `none`: no body. The router enforces the
      mode before any handler: a wrong content type is `415`, a body over the limit `413`, a body on a `none`
      operation `400`, all `effect: no_effect`.
    - `x-piw-response` (every success response): `json`, `sse`, `ndjson` or `binary`. An `sse` response
      declares `x-piw-max-frame-bytes`, the most bytes one record may carry.

    Named limit (invariant 8): private sockets and bearer grants do not isolate hostile code running as the
    same OS user.
  license:
    name: MIT
    identifier: MIT
  x-piw-json-max-bytes: 262144
servers:
  - url: http://pi-worker
    description: HTTP over the worker's private Unix socket. The host name is not resolved.
security:
  - bearerGrant: []
tags:
  - name: handshake
    description: Protocol negotiation and named limits.
  - name: inventory
    description: Read-only worker rows.
  - name: lifecycle
    description: Create, stop and relaunch workers.
  - name: input
    description: Prompt and follow-up input.
  - name: recovery
    description: Bindings, fences and unknown outcomes.
  - name: interruption
    description: Cancel and interrupt executions.
  - name: interactions
    description: Live questions and approvals.
  - name: readback
    description: Events, history, receipts and files.
  - name: children
    description: Child launch and child reports.
paths:
  /b2/hello:
    get:
      operationId: hello
      summary: Negotiate the protocol and read the named limits
      tags: [handshake]
      x-piw-mutation: false
      x-piw-body: none
      responses:
        '200':
          description: Supervisor identity, protocol and limits.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hello'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
  /b2/workers:
    get:
      operationId: workers.list
      summary: List the workers this grant may see
      tags: [inventory]
      x-piw-mutation: false
      x-piw-body: none
      responses:
        '200':
          description: Worker rows.
          x-piw-response: json
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: workers.create
      summary: Create a worker (reserve ids, then launch pi)
      tags: [lifecycle]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    get:
      operationId: workers.get
      summary: Read one worker row
      tags: [inventory]
      x-piw-mutation: false
      x-piw-body: none
      responses:
        '200':
          description: The worker row.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/prompt:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.prompt
      summary: Send a prompt to the bound session
      tags: [input]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prompt'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/follow_up:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.follow_up
      summary: Queue a follow-up against a named execution
      tags: [input]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowUp'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/steer:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.steer
      summary: Steer the named running execution (delivered after its current turn)
      tags: [input]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Steer'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
  /b2/workers/{worker_id}/rebind:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.rebind
      summary: Move the binding (new, fork, resume, navigate)
      tags: [recovery]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rebind'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/new:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.new
      summary: Bind a new session (pi's /new); the binding revision moves and the old binding is refused
      tags: [recovery]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Binding'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
  /b2/workers/{worker_id}/resolve_unknown:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: sessions.resolve_unknown
      summary: Lift a fence with one disposition (keep, abandon, observed)
      tags: [recovery]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resolve'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/stop:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: workers.stop
      summary: Stop the worker's pi; keeps the session and environment
      tags: [lifecycle]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Binding'
      responses:
        '200':
          description: Stop receipt with the observed termination.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/relaunch:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: workers.relaunch
      summary: Relaunch pi on the same session after confirmed cleanup
      tags: [lifecycle]
      x-piw-mutation: true
      x-piw-body: json
      x-piw-status: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Binding'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: executions.cancel
      summary: Cancel the current execution; allowed while fenced
      tags: [interruption]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Control'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/interrupt:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: executions.interrupt
      summary: Escape equivalent; allowed while fenced
      tags: [interruption]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Control'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/children:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: children.launch
      summary: Launch a child worker under the current execution
      tags: [children]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildLaunch'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/report:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: children.report
      summary: A child's claim to its parent (a claim, not proof)
      tags: [children]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/interactions:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    get:
      operationId: interactions.list
      summary: Live interactions of a worker
      tags: [interactions]
      x-piw-mutation: false
      x-piw-body: none
      responses:
        '200':
          description: Live interactions.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interactions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/interactions/status:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    get:
      operationId: interactions.status
      summary: One interaction's recorded state and answer stage
      tags: [interactions]
      x-piw-mutation: false
      x-piw-body: none
      parameters:
        - name: interaction_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: The interaction.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/interactions/answer:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: interactions.answer_if_current
      summary: Answer an interaction if its binding and revision are current
      tags: [interactions]
      x-piw-mutation: true
      x-piw-body: json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Answer'
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/history:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    get:
      operationId: history.page
      summary: Page the bound session's pi entries
      description: |
        Raw pi entries on the visible path from the session root to a
        pinned watermark, oldest first. Without a watermark it pins the
        worker's history marker: the newest entry on pi's selected path
        that is in the session file (never an entry pi has not written;
        a session with nothing written yet reads as an empty page). An
        entry too large for a page is a `too_large` stub; read it with
        `items.read`. History never creates a live interaction. Reading
        an archived session by `session_id` with no worker is P1-14.
      tags: [readback]
      x-piw-mutation: false
      x-piw-body: none
      parameters:
        - name: watermark
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: after
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One history page.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/entries/{entry_id}:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
      - name: entry_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: items.read
      summary: Read one whole pi entry of the bound session
      description: |
        The full entry a history page stubbed as `too_large`, up to
        1 MiB of its raw line; a longer entry is refused
        `entry_too_large`, `no_effect`. Image bytes are read with
        `blobs.read` (P1-16).
      tags: [readback]
      x-piw-mutation: false
      x-piw-body: none
      responses:
        '200':
          description: The entry.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/workers/{worker_id}/files/read:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    post:
      operationId: files.read
      summary: Read a file inside explicit confinement roots (sandboxed environments)
      tags: [readback]
      x-piw-mutation: false
      x-piw-body: json
      x-piw-status: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileRead'
      responses:
        '200':
          description: The file content.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/attachments/{attachment_id}:
    parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    put:
      operationId: attachments.stage
      summary: Stage one image for a later prompt (streamed binary upload)
      description: |
        The body is the image bytes, streamed; it never goes through the JSON path. The worker counts bytes as
        they arrive and refuses a body over `x-piw-max-bytes` (`hello.limits.attachment_max_bytes`) with `413`.
        The command and binding travel in headers. After the last byte the SHA-256 must equal
        `Piw-Content-Sha256` and the magic bytes must match the content type. A failure after the request bytes
        are written is `effect: unknown`: read the receipt, never re-upload blindly. Served from P1-16.
      tags: [input]
      x-piw-mutation: true
      x-piw-status: unsupported
      x-piw-body: binary
      x-piw-max-bytes: 2097152
      parameters:
        - name: Piw-Command-Id
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: Piw-Worker-Id
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: Piw-Worker-Epoch
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: Piw-Session-Id
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: Piw-Binding-Revision
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
        - name: Piw-Content-Sha256
          in: header
          required: true
          description: Lower-case hex SHA-256 of the body.
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
      requestBody:
        required: true
        description: The image bytes.
        content:
          image/jpeg: {}
          image/png: {}
          image/webp: {}
      responses:
        '200':
          $ref: '#/components/responses/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/receipts/{command_id}:
    parameters:
      - name: command_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: receipts.get
      summary: Read a command's receipt without redispatch
      description: |
        An unknown or expired command_id is never proof that nothing ran: an
        unknown one is refused `unknown_command_id_is_not_proof_of_no_effect`
        and an evicted one `receipt_expired`, both `effect: unknown`.
      tags: [readback]
      x-piw-mutation: false
      x-piw-body: none
      responses:
        '200':
          description: The receipt.
          x-piw-response: json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /b2/events:
    get:
      operationId: events.subscribe
      summary: One supervisor-wide SSE stream; a snapshot first on every attach
      description: |
        Each SSE `data` field is one `EventFrame` as JSON. The worker never replays: a reconnect gets a fresh
        `snapshot` whose `resync_reason` says why. A subscriber queue that overflows gets `overflow`, then the
        stream closes. One SSE record (its field lines, each with one line-ending byte) is at most 1 MiB
        (1048576 bytes); a client reads lines of any length up to that cap and refuses a longer record as
        `frame_too_large`, never truncating it.
      tags: [readback]
      x-piw-mutation: false
      x-piw-body: none
      parameters:
        - name: worker_id
          in: query
          description: Comma-separated worker ids to filter on.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: types
          in: query
          description: Comma-separated event types to filter on.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: resync
          in: query
          schema:
            type: string
            enum: [overflow]
        - name: Last-Event-ID
          in: header
          description: The cursor of the last frame seen, as JSON.
          schema:
            type: string
            maxLength: 1024
      responses:
        '200':
          description: Server-sent events.
          x-piw-response: sse
          x-piw-max-frame-bytes: 1048576
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventFrame'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
        '500':
          $ref: '#/components/responses/Unknown'
        '501':
          $ref: '#/components/responses/NotImplemented'
components:
  securitySchemes:
    bearerGrant:
      type: http
      scheme: bearer
      description: A per-caller grant registered by the owner; the worker stores only its hash.
  parameters:
    WorkerId:
      name: worker_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    Receipt:
      description: The command's receipt.
      x-piw-response: json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Receipt'
    BadRequest:
      description: Malformed request (JSON, schema, parameters); nothing began.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Refused:
      description: Refusal; the `effect` field says whether anything began. Never implies cancel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Request body over the advertised limit; nothing began.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Request body media type is not one the operation declares; nothing began.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unknown:
      description: Something may have happened; read the receipt, never retry blindly.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotImplemented:
      description: The operation is in the catalog but not served by this worker yet; nothing began.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
    AbsolutePath:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: ^/
    Text:
      type: string
      maxLength: 131072
    Effect:
      type: string
      enum: [no_effect, unknown]
      description: '`no_effect`: the refused request began nothing. `unknown`: something may have happened.'
    Error:
      type: object
      additionalProperties: false
      required: [error, effect]
      properties:
        error:
          type: string
          minLength: 1
          maxLength: 256
          description: Machine-readable reason, for example `request_schema_mismatch` or `session_fenced`.
        effect:
          $ref: '#/components/schemas/Effect'
        detail:
          type: string
          maxLength: 1024
          description: Human-readable detail. Never contains request values.
        uncertain_command_id:
          $ref: '#/components/schemas/Id'
        holder_worker_id:
          $ref: '#/components/schemas/Id'
        expected_binding_revision:
          type: integer
          minimum: 1
        received_binding_revision:
          type: integer
        no_effect_evidence:
          type: string
          maxLength: 1024
          description: Present only when a refusal after dispatch is `no_effect` (ProvenNoEffect).
    Protocol:
      type: object
      additionalProperties: false
      required: [major, minor]
      properties:
        major:
          type: integer
          minimum: 0
          description: A client refuses an unknown major.
        minor:
          type: integer
          minimum: 0
    Hello:
      type: object
      additionalProperties: false
      required:
        - protocol
        - worker_version
        - supervisor_id
        - supervisor_epoch
        - pi_version
        - capabilities
        - limits
        - named_limits
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
        worker_version:
          type: string
          minLength: 1
          maxLength: 64
        supervisor_id:
          $ref: '#/components/schemas/Id'
        supervisor_epoch:
          $ref: '#/components/schemas/Id'
          description: Changes on every supervisor start.
        pi_version:
          type: [string, 'null']
          maxLength: 64
          description: The pinned pi SDK version; null while no pi host is available.
        capabilities:
          type: array
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 128
        limits:
          $ref: '#/components/schemas/Limits'
        named_limits:
          type: array
          maxItems: 64
          description: Stated limits of the guarantees (contract invariant 8).
          items:
            type: string
            minLength: 1
            maxLength: 1024
    Limits:
      type: object
      additionalProperties: false
      required:
        - request_body_bytes
        - attachment_max_bytes
        - attachments_per_message
        - attachments_total_bytes
        - event_frame_bytes
        - journal_max_bytes
        - journal_control_reserve_bytes
        - receipts_max
        - receipt_retention_min_seconds
        - receipt_expired_ids_max
      properties:
        request_body_bytes:
          type: integer
          minimum: 1
          description: The JSON request body cap (`x-piw-json-max-bytes`).
        attachment_max_bytes:
          type: integer
          minimum: 1
          description: The most bytes one `attachments.stage` body may carry.
        attachments_per_message:
          type: integer
          minimum: 1
          description: The most attachments one `sessions.prompt` may reference.
        attachments_total_bytes:
          type: integer
          minimum: 1
          description: The most attachment bytes one `sessions.prompt` may reference.
        event_frame_bytes:
          type: integer
          minimum: 1
          description: The most bytes one `events.subscribe` SSE record may carry.
        journal_max_bytes:
          type: integer
          minimum: 1
          description: |
            The supervisor journal never grows past this many bytes. Compaction
            rewrites it to the retained records (each worker's and interaction's
            latest record, retained receipts, expired command ids) before it
            fills.
        journal_control_reserve_bytes:
          type: integer
          minimum: 0
          description: |
            Journal room only control records may use: quota-exempt commands
            (`workers.stop`, `executions.cancel`, `executions.interrupt`,
            `sessions.resolve_unknown`, `children.report`) and stop, exit,
            fault, fence and recovery records. Before dispatch, an ordinary
            command reserves room for every record it can emit (its receipts,
            and its worker's rows, settlements and interactions); it is refused
            `journal_result_capacity` (`no_effect`) when that room would reach
            this reserve or the room every worker that may still be stopped
            needs for its own stop and exit records. An ordinary record never
            uses either.
        receipts_max:
          type: integer
          minimum: 1
          description: |
            The most receipts retained. At the bound the oldest evictable
            receipts are evicted: final, older than
            `receipt_retention_min_seconds`, and not part of any pending
            decision. Never evicted: an unresolved `outcome_unknown`, an
            unfinished command, the command that created a worker, and a
            command a worker's unsettled execution, fence, queue or child
            lineage names. When nothing is evictable an ordinary command is
            refused `receipt_capacity` (`no_effect`); quota-exempt commands are
            never refused for count.
        receipt_retention_min_seconds:
          type: integer
          minimum: 0
          description: |
            A final receipt is retained at least this long after its command
            was created.
        receipt_expired_ids_max:
          type: integer
          minimum: 0
          description: |
            How many evicted command ids the worker still remembers. Reusing
            one, or reading its receipt, is refused `receipt_expired` with
            `effect: unknown`: never run again, never proof that nothing ran.
            An id evicted longer ago than this still never runs again (contract
            rule "no replay past retention"): the worker keeps the newest issue
            time of a forgotten UUIDv7 `command_id` and whether any other id was
            forgotten, and refuses a command id it may have forgotten (a UUIDv7
            not issued after that time, or any other id once one was forgotten)
            `command_id_beyond_retention` with `effect: no_effect`, before any
            record. Callers mint every `command_id` as a UUIDv7 (RFC 9562).
    Binding:
      type: object
      additionalProperties: false
      required: [command_id, worker_epoch, session_id, binding_revision]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        binding_revision:
          type: integer
          minimum: 1
    Prompt:
      type: object
      additionalProperties: false
      required: [command_id, worker_epoch, session_id, binding_revision, message]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        binding_revision:
          type: integer
          minimum: 1
        message:
          $ref: '#/components/schemas/Text'
        if_busy:
          type: string
          enum: [steer, follow_up, reject]
          description: >-
            What to do when an execution is running: `steer` it, queue a `follow_up` after it, or `reject` the prompt
            (`worker_busy`, `no_effect`). Absent means `reject`.
    FollowUp:
      type: object
      additionalProperties: false
      required: [command_id, worker_epoch, session_id, binding_revision, message, execution_id]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        binding_revision:
          type: integer
          minimum: 1
        message:
          $ref: '#/components/schemas/Text'
        execution_id:
          $ref: '#/components/schemas/Id'
    Steer:
      type: object
      additionalProperties: false
      required: [command_id, worker_epoch, session_id, binding_revision, message, execution_id]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        binding_revision:
          type: integer
          minimum: 1
        message:
          $ref: '#/components/schemas/Text'
        execution_id:
          $ref: '#/components/schemas/Id'
    Control:
      type: object
      additionalProperties: false
      required: [command_id, worker_epoch, session_id, binding_revision]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        binding_revision:
          type: integer
          minimum: 1
        execution_id:
          $ref: '#/components/schemas/Id'
    Resolve:
      type: object
      additionalProperties: false
      required: [command_id, worker_epoch, session_id, binding_revision, fence_generation, disposition]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          $ref: '#/components/schemas/Id'
        binding_revision:
          type: integer
          minimum: 1
        uncertain_command_id:
          $ref: '#/components/schemas/Id'
        execution_id:
          $ref: '#/components/schemas/Id'
        fence_generation:
          type: integer
          minimum: 0
        disposition:
          type: string
          enum: [keep, abandon, observed]
    Rebind:
      type: object
      additionalProperties: false
      required: [command_id, worker_epoch, session_id, binding_revision, action]
      properties:
        command_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
