    ExecutionStartedEvent:
      type: object
      additionalProperties: false
      description: >-
        pi reported agent_start for the admitted execution; the row is
        journaled.
      x-piw-event:
        type: execution.started
        producer: supervisor
        durability: journal
        visibility: worker
      required:
        - type
        - cursor
        - event_id
        - producer
        - execution_id
        - evidence
        - worker_id
        - data
      properties:
        type:
          type: string
          const: execution.started
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          $ref: '#/components/schemas/Id'
        evidence:
          type: string
          const: supervisor_journal_fsynced
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [command_id]
          properties:
            command_id:
              $ref: '#/components/schemas/Id'
    AssistantDeltaEvent:
      type: object
      additionalProperties: false
      description: >-
        The assistant text pi is streaming (pi's `message_update` text
        deltas), memory only and never replayed. `tail` is the last at most
        2048 characters of the message's text so far and `length` its full
        length: a client replaces its screen tail with `tail`, so a lost
        delta costs nothing. A subscriber whose transport is backpressured
        holds at most one undelivered delta per worker (a newer one replaces
        it), so a delta storm cannot overflow its queue.
      x-piw-event:
        type: assistant.delta
        producer: pi
        durability: memory
        visibility: worker
      required:
        - type
        - cursor
        - event_id
        - producer
        - execution_id
        - evidence
        - worker_id
        - data
      properties:
        type:
          type: string
          const: assistant.delta
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: observed_memory
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [tail, length]
          properties:
            tail:
              type: string
              maxLength: 2048
            length:
              type: integer
              minimum: 0
    ToolStartedEvent:
      type: object
      additionalProperties: false
      description: >-
        pi started a tool call (`tool_execution_start`): the pending tool.
        Memory only, never replayed.
      x-piw-event:
        type: tool.started
        producer: pi
        durability: memory
        visibility: worker
      required:
        - type
        - cursor
        - event_id
        - producer
        - execution_id
        - evidence
        - worker_id
        - data
      properties:
        type:
          type: string
          const: tool.started
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: observed_memory
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          $ref: '#/components/schemas/ToolCall'
    ToolFinishedEvent:
      type: object
      additionalProperties: false
      description: >-
        pi finished a tool call (`tool_execution_end`). Memory only, never
        replayed.
      x-piw-event:
        type: tool.finished
        producer: pi
        durability: memory
        visibility: worker
      required:
        - type
        - cursor
        - event_id
        - producer
        - execution_id
        - evidence
        - worker_id
        - data
      properties:
        type:
          type: string
          const: tool.finished
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: observed_memory
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [tool_call_id, name, summary, is_error]
          properties:
            tool_call_id:
              $ref: '#/components/schemas/ToolCallId'
            name:
              $ref: '#/components/schemas/ToolName'
            summary:
              $ref: '#/components/schemas/ToolSummary'
            is_error:
              type: boolean
    ToolCall:
      type: object
      additionalProperties: false
      required: [tool_call_id, name, summary]
      properties:
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        name:
          $ref: '#/components/schemas/ToolName'
        summary:
          $ref: '#/components/schemas/ToolSummary'
    ToolCallId:
      type: string
      minLength: 1
      maxLength: 512
      description: >-
        pi's tool call id (a longer one is cut to 512 characters, the same
        way in both events).
    ToolName:
      type: string
      minLength: 1
      maxLength: 128
    ToolSummary:
      type: [string, 'null']
      maxLength: 200
      description: >-
        One line about the call: the first of the arguments `command`,
        `path`, `file_path`, `pattern`, `url`, `query` or `description` that
        is a string, cut to 200 characters; null when there is none.
    ReceiptUpdatedEvent:
      type: object
      additionalProperties: false
      description: >-
        A receipt record of a worker's command was journaled (intent,
        dispatch, result, recovery). `receipt` is that record; read
        `receipts.get` after a gap.
      x-piw-event:
        type: receipt.updated
        producer: supervisor
        durability: journal
        visibility: worker
      required:
        - type
        - cursor
        - event_id
        - producer
        - execution_id
        - evidence
        - worker_id
        - data
      properties:
        type:
          type: string
          const: receipt.updated
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        evidence:
          type: string
          const: supervisor_journal_fsynced
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [receipt]
          properties:
            receipt:
              $ref: '#/components/schemas/Receipt'
    FenceSetEvent:
      type: object
      additionalProperties: false
      description: >-
        An uncertain command joined the worker's fence (the fence latched or
        its generation rose), after the fenced row was journaled. Session
        writes are refused until `sessions.resolve_unknown`. `fence.fenced_at`
        is when the fence first latched, not when this command joined it.
      x-piw-event:
        type: fence.set
        producer: supervisor
        durability: journal
        visibility: worker
      required:
        - type
        - cursor
        - event_id
        - producer
        - execution_id
        - evidence
        - worker_id
        - data
      properties:
        type:
          type: string
          const: fence.set
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: >-
            The uncertain execution, when the uncertain command is the
            worker's execution.
        evidence:
          type: string
          const: supervisor_journal_fsynced
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [command_id, fence_generation, fence]
          properties:
            command_id:
              $ref: '#/components/schemas/Id'
              description: The uncertain command that joined the fence.
            fence_generation:
              type: integer
              minimum: 1
            fence:
              $ref: '#/components/schemas/Fence'
    AttachmentUpdatedEvent:
      type: object
      additionalProperties: false
      description: >-
        An attachment's durable record changed (`staged` or `released`).
      x-piw-event:
        type: attachment.updated
        producer: supervisor
        durability: journal
        visibility: worker
      required:
        - type
        - cursor
        - event_id
        - producer
        - execution_id
        - evidence
        - worker_id
        - data
      properties:
        type:
          type: string
          const: attachment.updated
        cursor:
          $ref: '#/components/schemas/Cursor'
        event_id:
          $ref: '#/components/schemas/Id'
        producer:
          $ref: '#/components/schemas/Producer'
        execution_id:
          type: 'null'
        evidence:
          type: string
          const: supervisor_journal_fsynced
        worker_id:
          $ref: '#/components/schemas/Id'
        data:
          type: object
          additionalProperties: false
          required: [attachment]
          properties:
            attachment:
              $ref: '#/components/schemas/AttachmentStatus'
