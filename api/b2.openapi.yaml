        - leaf_id
        - cwd
        - status
        - foreground
        - execution
        - fence
        - history
        - cleanup
        - pending_interactions
      properties:
        worker_id:
          $ref: '#/components/schemas/Id'
        worker_epoch:
          $ref: '#/components/schemas/Id'
        supervisor_epoch:
          $ref: '#/components/schemas/Id'
        session_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
